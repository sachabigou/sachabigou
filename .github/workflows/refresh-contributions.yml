name: Refresh contribution calendar

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-contribution-calendar
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Refresh the calendar image
        run: node scripts/refresh-contributions.mjs
      - name: Publish an updated calendar
        run: |
          git add -- assets/contributions.svg
          if git diff --cached --quiet; then
            echo 'Calendar is already current.'
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' -c commit.gpgsign=false commit -m 'Refresh GitHub contribution calendar'
          git push
